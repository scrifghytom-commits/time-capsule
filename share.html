<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>有人给你写了一封信</title>
<link rel="stylesheet" href="style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .share-wrap{max-width:560px;width:100%}
</style>
</head>
<body>
<div class="share-wrap">
  <div class="letter-paper" style="text-align:center">
    <h1 class="title">💌 有人给你写了一封信</h1>
    <p class="subtitle" id="share-meta">加载中…</p>
    <div id="share-body"></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);

/* ---- 加密 ---- */
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function decrypt(payload, password) {
  const key = await deriveKey(password, new Uint8Array(payload.salt));
  const buf = await crypto.subtle.decrypt(
    { name:'AES-GCM', iv:new Uint8Array(payload.iv) },
    key, new Uint8Array(payload.data));
  return new TextDecoder().decode(buf);
}
function fmtDate(ts){
  const d=new Date(ts);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- Base64URL 解码 ---- */
function b64uDecode(s) {
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---- 解析 hash ---- */
let raw = location.hash.startsWith('#') ? location.hash.slice(1) : '';
try { raw = decodeURIComponent(raw); } catch(e){}

if (!raw) {
  $('#share-meta').textContent = '';
  $('#share-body').innerHTML = '<p class="error-msg">链接无效或已损坏</p>';
} else {
  let data;
  try {
    data = JSON.parse(b64uDecode(raw));
  } catch(e) {
    $('#share-meta').textContent = '';
    $('#share-body').innerHTML = '<p class="error-msg">链接已损坏</p>';
  }

  if (data) {
    const left = data.unlockAt - Date.now();
    if (left > 0) {
      $('#share-meta').textContent = `这封信将在 ${fmtDate(data.unlockAt)} 解锁`;
      $('#share-body').innerHTML = `
        <div style="font-size:48px;margin:20px 0">🔒</div>
        <div id="share-countdown" class="flip-clock" style="margin:16px 0"></div>
        ${data.hint?`<p class="m-sub">提示：${escapeHtml(data.hint)}</p>`:''}
        <div style="margin-top:18px;text-align:left;border-top:1px dashed var(--line);padding-top:16px">
          <p class="m-sub" style="margin-bottom:8px">🔑 想提前打开？输入密码</p>
          <div class="field">
            <input type="password" id="spwd" placeholder="密码">
          </div>
          <div id="serr"></div>
          <button class="ghost-btn" id="sopen" style="width:100%;margin-top:10px">提前解锁</button>
        </div>
      `;
      startShareCountdown(data.unlockAt, data);
      bindOpen(data);
    } else {
      // 已到解锁时间：自动解密展示，无需密码
      $('#share-meta').textContent = `写于 ${fmtDate(data.createdAt)}`;
      $('#share-body').innerHTML = `<div style="text-align:center;padding:30px 0;color:var(--muted)">正在打开…</div>`;
      autoDecryptShare(data);
    }
  }
}

/* 已到时间：自动解密展示 */
async function autoDecryptShare(data) {
  try {
    let payload;
    if (data.autoEnc && data.timeKey) {
      const text = await decrypt(data.autoEnc, data.timeKey);
      payload = JSON.parse(text);
    } else {
      // 兼容旧数据：没有 autoEnc，显示密码输入
      showSharePassword(data);
      return;
    }
    renderShareContent(payload);
  } catch (e) {
    // 解密失败，回退到密码输入
    showSharePassword(data);
  }
}

function showSharePassword(data) {
  $('#share-body').innerHTML = `
    <div class="field" style="text-align:left;margin-top:20px">
      <span>输入密码查看内容</span>
      <input type="password" id="spwd" placeholder="密码" autofocus>
    </div>
    <div id="serr"></div>
    <button class="primary-btn" style="margin-top:14px" id="sopen">打开信件</button>
  `;
  bindOpen(data);
}

function renderShareContent(payload) {
  const paragraphs = payload.paragraphs || [payload.content || ''];
  const parasHtml = paragraphs
    .map(p => `<p>${escapeHtml(p) || '&nbsp;'}</p>`).join('');
  $('#share-body').innerHTML = `
    <div class="letter-content" style="text-align:left">
      ${payload.blessing?`<div class="content-blessing">${escapeHtml(payload.blessing)}</div>`:''}
      <div>${parasHtml}</div>
      ${(payload.images||[]).map(s=>`<img src="${s}" style="max-width:100%;border-radius:8px;margin:10px 0">`).join('')}
      <div class="content-sign">—— ${escapeHtml(payload.signature||'佚名')}</div>
      <div class="content-date">${fmtDate(payload.writtenAt)}</div>
    </div>
  `;
}

function startShareCountdown(unlockAt, data) {
  const box = $('#share-countdown');
  const cache = {};
  const t = setInterval(render, 1000);
  function render() {
    const ms = unlockAt - Date.now();
    if (ms <= 0) {
      clearInterval(t);
      box.innerHTML = '<div style="color:#27ae60">✨ 已到时间，正在打开…</div>';
      setTimeout(() => autoDecryptShare(data), 800);
      return;
    }
    const s = Math.floor(ms/1000);
    const units = [
      {k:'d',v:Math.floor(s/86400),l:'天'},
      {k:'h',v:Math.floor(s%86400/3600),l:'时'},
      {k:'m',v:Math.floor(s%3600/60),l:'分'},
      {k:'s',v:s%60,l:'秒'}
    ];
    if (!box.dataset.built) {
      box.innerHTML = units.map(u => `
        <div class="flip-unit">
          <span class="flip-digits" data-k="${u.k}"></span>
          <span class="lab">${u.l}</span>
        </div>`).join('');
      box.dataset.built = '1';
    }
    units.forEach(u => {
      const str = String(u.v).padStart(2,'0');
      const prev = cache[u.k] || ['',''];
      const dbox = box.querySelector(`[data-k="${u.k}"]`);
      str.split('').forEach((ch,i) => {
        let el = dbox.children[i];
        if (!el) {
          el = document.createElement('span');
          el.className='flip-digit';
          el.innerHTML='<span class="d"></span>';
          dbox.appendChild(el);
        }
        const d = el.querySelector('.d');
        if (prev[i] !== ch) {
          d.textContent = ch;
          el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
        }
      });
      cache[u.k] = str.split('');
    });
  }
  render();
}

function bindOpen(data) {
  const open = async () => {
    const pwd = $('#spwd').value;
    if (!pwd) {
      $('#serr').innerHTML = '<div class="error-msg">请输入密码</div>';
      setTimeout(()=>$('#serr').innerHTML='',2600); return;
    }
    const btn = $('#sopen'); btn.disabled = true; btn.textContent='解密中…';
    try {
      const text = await decrypt(data.enc, pwd);
      const payload = JSON.parse(text);
      renderShareContent(payload);
    } catch(e) {
      btn.disabled = false; btn.textContent='打开信件';
      $('#serr').innerHTML = '<div class="error-msg">密码错误</div>';
      setTimeout(()=>$('#serr').innerHTML='',2600);
    }
  };
  $('#sopen').onclick = open;
  $('#spwd').addEventListener('keydown', e => { if (e.key==='Enter') open(); });
}
</script>
</body>
</html>
